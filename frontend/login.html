<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIRKMARK - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="login-page">
    <div class="container">
        <!-- Logo y Branding -->
        <div class="branding">
            <div class="logo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <rect x="25" y="30" width="50" height="40" rx="5" fill="#4169E1" stroke="#4169E1" stroke-width="2"/>
                    <path d="M40 45 L50 55 L60 45" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    <rect x="30" y="70" width="40" height="3" rx="1.5" fill="#4169E1"/>
                </svg>
            </div>
            <h1>KIRKMARK</h1>
            <p>Sistema de Gestión de Ventas</p>
        </div>

        <!-- Contenedor de Login -->
        <div class="login-container">
            <h2>Iniciar Sesión</h2>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="login-usuario">Usuario</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="login-usuario" placeholder="Ingrese su usuario" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-contraseña">Contraseña</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-contraseña" placeholder="Ingrese su contraseña" required>
                    </div>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" id="remember-checkbox">
                        <span>Recuérdame</span>
                    </label>
                    <a href="#" class="forgot-password">¿Olvidó su contraseña?</a>
                </div>

                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>

            <div class="footer-security">
                🔐 Conexión segura y encriptada
            </div>
        </div>

        <!-- Mensajes de alerta -->
        <div id="alert" class="alert"></div>
    </div>

    <script src="services/auth.js"></script>
    <script src="login.js"></script>
</body>
</html>
